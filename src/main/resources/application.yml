server:
  port: 8082

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/plazas_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}

appDescription: "Pragma Powerup"
appVersion: "1.0.0"
